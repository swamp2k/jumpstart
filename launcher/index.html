<!doctype html>
<html><head><meta charset="utf-8"><title>JumpStart</title>
<style>
  html,body{margin:0;height:100%;background:#14161a;color:#e8e8e8;font:14px "Segoe UI",sans-serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100%}
  #bar{position:relative;margin:40px 0 24px}
  #q{width:520px;padding:12px 16px;font-size:20px;background:#22262d;color:#fff;border:1px solid #3a404a;border-radius:8px;outline:none}
  #sys{position:absolute;left:100%;top:0;bottom:0;margin-left:10px;width:48px;display:flex;align-items:center;justify-content:center;background:#22262d;color:#8a909a;border:1px solid #3a404a;border-radius:8px;cursor:pointer;padding:0}
  #sys:hover{color:#ddd}#sys.on{background:#34507a;color:#fff}
  #sys svg{width:22px;height:22px}
  #grid{flex:1;width:92%;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,120px);grid-auto-rows:110px;gap:8px;justify-content:center;align-content:start;padding-bottom:40px}
  .cell{width:120px;height:110px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 6px;border-radius:8px;cursor:default}
  .cell img{width:48px;height:48px;object-fit:contain;flex:none}
  .cell span{margin-top:8px;text-align:center;max-width:108px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .cell.sel{background:#34507a}
  .cell:hover:not(.sel){background:#242a33}
  #grid::-webkit-scrollbar{width:8px}#grid::-webkit-scrollbar-thumb{background:#3a404a;border-radius:4px}
  #menu{position:fixed;display:none;background:#22262d;border:1px solid #3a404a;border-radius:6px;padding:4px;z-index:9;box-shadow:0 4px 16px #0008}#menu div{padding:8px 14px;border-radius:4px;cursor:default;white-space:nowrap}#menu div:hover{background:#34507a}  #sets{position:absolute;left:100%;top:0;bottom:0;margin-left:68px;width:48px;display:flex;align-items:center;justify-content:center;background:#22262d;color:#8a909a;border:1px solid #3a404a;border-radius:8px;cursor:pointer;padding:0;font-size:22px}
  #sets:hover{color:#ddd}
  #panel{display:none;position:absolute;top:100%;right:-116px;margin-top:8px;background:#22262d;border:1px solid #3a404a;border-radius:8px;padding:10px 14px;z-index:9;width:230px}
  #panel label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px}#panel .off{color:#777}
</style></head>
<body><div id="wrap"><div id="menu"><div id="mi"></div></div><div id="bar"><input id="q" placeholder="Search apps" autocomplete="off" spellcheck="false"><button id="sets" tabindex="-1">&#9776;</button><div id="panel"></div><button id="sys" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div><div id="grid"></div></div>
<script>
let all=[],shown=[],sel=0,showSys=false,settings={};
const q=document.getElementById('q'),grid=document.getElementById('grid');
function render(){
  const t=q.value.trim().toLowerCase();
  shown=all.filter(a=>(showSys||!a.system)&&a.name.toLowerCase().includes(t));
  const b=document.getElementById('sys');b.classList.toggle('on',showSys);
  if(sel>=shown.length)sel=Math.max(0,shown.length-1);
  grid.textContent='';
  shown.forEach((a,i)=>{
    const c=document.createElement('div');c.className='cell'+(i===sel?' sel':'');
    const im=document.createElement('img');im.src=a.icon||'';
    const s=document.createElement('span');s.textContent=a.name;
    c.append(im,s);c.onclick=e=>{e.stopPropagation();api.launch(a.id)};
    c.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();openMenu(e,a)};
    grid.append(c);
  });
}
const menu=document.getElementById('menu'),mi=document.getElementById('mi');
function openMenu(e,a){
  mi.textContent=a.system?'Always show this app':'Hide this app';
  mi.onclick=ev=>{ev.stopPropagation();api.setOverride(a.name,a.system?'show':'hide');menu.style.display='none';q.focus()};
  menu.style.left=Math.min(e.clientX,innerWidth-220)+'px';menu.style.top=e.clientY+'px';menu.style.display='block';
}
document.addEventListener('click',()=>{menu.style.display='none'});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('.cell'))menu.style.display='none'});
function mark(){
  [...grid.children].forEach((c,i)=>c.classList.toggle('sel',i===sel));
  const c=grid.children[sel];if(c)c.scrollIntoView({block:'nearest'});
}
function cols(){return Math.max(1,Math.floor((grid.clientWidth+8)/128))}
q.oninput=()=>{sel=0;render()};
document.onkeydown=e=>{
  const n=shown.length;
  if(e.key==='Escape'){if(menu.style.display==='block'){menu.style.display='none';return}api.hide();return}
  if(e.key==='Tab'){e.preventDefault();showSys=!showSys;sel=0;render();return}
  if(e.key==='Enter'){if(n)api.launch(shown[sel].id);return}
  const d={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols(),ArrowUp:-cols()}[e.key];
  if(d!==undefined){e.preventDefault();const s=sel+d;if(s>=0&&s<n){sel=s;mark()}}
};
document.getElementById('sys').onclick=()=>{showSys=!showSys;sel=0;render();q.focus()};
document.getElementById('wrap').onclick=e=>{if(['wrap','grid','bar'].includes(e.target.id))api.hide()};

const panel=document.getElementById('panel');
function buildPanel(){
  const rows=[['steam','Steam games',settings.installed&&settings.installed.steam],['epic','Epic games',settings.installed&&settings.installed.epic],['xbox','Xbox / Game Pass games',settings.installed&&settings.installed.xbox],['systemTools','Show hidden apps by default',true]];
  panel.textContent='';
  rows.forEach(([k,label,ok])=>{
    const l=document.createElement('label');if(!ok)l.className='off';
    const c=document.createElement('input');c.type='checkbox';c.checked=!!settings[k]&&ok;c.disabled=!ok;
    c.onchange=()=>{settings[k]=c.checked;api.setSettings({[k]:c.checked})};
    l.append(c,label+(ok||k==='systemTools'?'':' (not found)'));panel.append(l);
  });
}
document.getElementById('sets').onclick=e=>{e.stopPropagation();const open=panel.style.display==='block';if(!open)buildPanel();panel.style.display=open?'none':'block';q.focus()};
panel.onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>{panel.style.display='none'});
api.getSettings().then(s=>{settings=s;showSys=!!s.systemTools;render()});
api.onApps(a=>{all=a;render()});
api.onReset(()=>{panel.style.display='none';showSys=!!settings.systemTools;q.value='';sel=0;grid.scrollTop=0;render();q.focus()});
api.getApps().then(a=>{all=a;render();q.focus()});
</script></body></html>
